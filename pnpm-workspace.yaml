allowBuilds:
  # Transitive-only, via better-auth's OPTIONAL Prisma adapter peer. Strut uses the better-sqlite3/D1
  # (Kysely) path, never Prisma — nothing imports @prisma/client — so its postinstall (prisma generate)
  # must NOT run. `false` silences pnpm's "ignored builds" prompt without building an unused client.
  '@prisma/client': false
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  sharp: false
  unrs-resolver: true
  workerd: true
overrides:
  # @rindle/cli@0.10.5 was published with `"@rindle/agent-context": "workspace:*"` left unrewritten, which
  # no install outside the rindle monorepo can resolve (ERR_PNPM_WORKSPACE_PKG_NOT_FOUND). Point it at the
  # release that shipped alongside it. Drop this once the CLI is republished with a real version.
  '@rindle/cli>@rindle/agent-context': 0.10.5
