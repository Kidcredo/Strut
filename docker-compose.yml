version: '3.8'

services:
  strut-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Production preview server
      - "3000:3000"
      # Rindle daemon ports (HTTP & WS)
      - "7600:7600"
      - "7601:7601"
    environment:
      # These variables are needed for local auth development (as seen in .env.example)
      - BETTER_AUTH_SECRET=supersecret-1234567890-openssl-rand-base64-32
      - BETTER_AUTH_URL=http://localhost:3000
    # Note: Volumes are removed for production so the pre-built image code is used rather than live local files.
