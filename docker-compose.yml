version: '3.8'

services:
  strut-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Vite development server
      - "3000:3000"
      # Rindle daemon ports (HTTP & WS)
      - "7600:7600"
      - "7601:7601"
    volumes:
      # Mount the local directory to /app in the container for live reloading
      - .:/app
      # Prevent local node_modules from overriding the container's node_modules
      - /app/node_modules
    environment:
      # These variables are needed for local auth development (as seen in .env.example)
      - BETTER_AUTH_SECRET=supersecret-1234567890-openssl-rand-base64-32
      - BETTER_AUTH_URL=http://localhost:3000
